name: Build and test

on:
  workflow_dispatch:

jobs:
  build-and-test:
    if: github.repository_owner == 'winder'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v3
    - uses: ./.github/actions/setup-java-maven

    - name: Build and test
      run: ./mvnw clean install

    name: build-and-test [ubuntu-24.04--x64]
    timeout-minutes: 150
